[package]
name = "gql-oracle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Test-only GQL parser oracle (ANTLR, GQL.g4) and sentence generator for lpg (TS-30)"

[dependencies]
# Runtime of the parser that `generate.sh` writes to `src/gen/` (TS-31:
# oracle crate only, never a dependency of `lpg`).
antlr4rust = "=0.6.0"

# The dev and test builds of the generated parser (2.8 MB of Rust) use
# opt-level 1.
[profile.dev]
opt-level = 1

# Standalone: never a member of the lpg workspace.
[workspace]
