# cargo-deny policy (NFR-DEP-002, TS-31).
#
# The allow-list holds the licences that occur in the resolved dependency
# tree and are on the NFR-DEP-002 list (user decision 2026-10-02): MIT,
# Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause,
# ISC, Zlib, 0BSD, BSL-1.0, CC0-1.0, Unicode-3.0. Add a licence from that
# list here when a new dependency brings it. A crate whose licence
# expression offers alternatives passes when one of them is allowed.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
]
