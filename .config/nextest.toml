# cargo-nextest configuration (TS-30).
#
# The `stress` profile is the stress profile of TS-30 R7 (rmp #20): it runs
# every concurrency test of the crate as 16 concurrent copies of its process
# (`LPG_STRESS_COPIES` changes the number), each with its own seed, through
# the wrapper script `.config/stress-copies.sh`, and prints the seeds:
#
#     cargo nextest run -p lpg --profile stress
#
# The default profile caps the tests that use the most space in
# `/tmp/lpgram` (test group `disk-heavy`, below).

experimental = ["wrapper-scripts"]

# The modules whose tests use the most space in `/tmp/lpgram`: each test
# was measured alone (`du -sk` every 20 ms, 2026-10-08); these modules
# hold all 35 tests that peak at 60 MiB or more (largest 274 MiB). At most
# three of their 89 tests run at once, so a default run stays under the
# 1 GiB limit of CLAUDE.md: the three largest with the thirteen largest
# other tests sum to 990 MiB.
[test-groups]
disk-heavy = { max-threads = 3 }

# A hung test fails the run: it is killed after 10 periods of 60 s. The
# slowest legitimate test, `suites::fault::restore_` in full on both lab
# file systems, took 189.9 s (2026-10-08, docs/evidence/lab-sprint-2).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '''
test(/^ops::(backup|migrate|restore)::/)
| test(/^storage::(btree::bulk|checkpoint|recovery)::/)
| test(/^suites::/)
| test(/^tx::commit::/)
'''
test-group = "disk-heavy"

[scripts.wrapper.copies]
command = { command-line = ".config/stress-copies.sh", relative-to = "workspace-root" }

[profile.stress]
# The tests that run threads against one database or one structure.
default-filter = '''
test(=obs::recording::tests::concurrent_calls_are_all_recorded)
| test(=ops::backup::tests::a_backup_under_four_committers_restores_to_one_commit_point)
| test(=storage::btree::tests::concurrent_readers_during_splits_see_every_committed_key_exactly_once)
| test(=storage::checkpoint::tests::fuzzy_checkpoints_under_concurrent_commits_lose_nothing)
| test(=storage::freelist::tests::registry_horizon_is_the_lowest_registered_value)
| test(=storage::memory::tests::concurrent_reservations_never_exceed_the_cap)
| test(=storage::memory::tests::the_gauge_follows_every_change)
| test(=storage::pool::tests::sixteen_threads_fetching_and_reserving_stay_within_the_cap)
| test(=tx::commit::tests::a_checkpoint_skips_a_page_changed_before_its_commit_joins_and_writes_it_on_the_revisit)
| test(=tx::commit::tests::a_lone_committer_never_waits_in_a_gather_window)
| test(=tx::commit::tests::a_page_taken_by_an_undone_batch_waits_for_earlier_readers)
| test(=tx::commit::tests::a_panic_under_the_commit_latch_makes_the_database_unusable)
| test(=tx::commit::tests::audit_a_failed_capture_never_reaches_the_wal)
| test(=tx::commit::tests::commits_become_durable_while_a_segment_is_created_ahead_of_use)
| test(=tx::commit::tests::enospc_creating_a_segment_fails_that_commit_while_a_concurrent_read_succeeds)
| test(=tx::commit::tests::every_commit_returns_after_a_sync_covering_its_commit_frame)
| test(=tx::commit::tests::four_closed_loop_committers_share_one_flush)
| test(=tx::commit::tests::pages_freed_by_an_undurable_commit_keep_the_undo_image_once_it_is_durable)
| test(=tx::commit::tests::sixteen_threads_committing_disjoint_batches_apply_each_exactly_once)
| test(/^tx::lock::tests::threads::/)
| test(=tx::tests::mvcc::a_paused_commit_is_invisible_until_published_then_wholly_visible)
| test(=tx::tests::isolation::a_writer_waits_for_a_held_lock_and_continues_when_its_holder_ends)
| test(=tx::tests::isolation::a_closed_wait_cycle_aborts_the_requester_with_deadlock)
| test(=tx::tests::isolation::reads_never_wait_for_writers_or_the_commit_latch)
| test(=tx::tests::isolation::sixteen_threads_with_disjoint_writes_all_commit_and_survive_reopen)
| test(=tx::tests::hermitage::g0_write_cycles_are_prevented)
| test(=tx::tests::hermitage::otv_observed_transaction_vanishes_is_prevented)
| test(=tx::tests::hermitage::pmp_predicate_many_preceders_is_prevented)
| test(=tx::tests::hermitage::p4_lost_update_is_prevented)
| test(=tx::tests::gc::the_collector_frees_old_versions_after_commits)
| test(=tx::tests::gc::after_a_crash_the_collector_finds_the_garbage_again)
| test(=tx::tests::elle::elle_finds_no_anomaly_in_eight_thread_list_append_histories)
| test(=tx::tests::elle::elle_finds_no_anomaly_in_eight_thread_rw_register_histories)
'''
# Sixteen copies share the machine: one test at a time.
test-threads = 1
success-output = "immediate"
failure-output = "immediate"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.stress.scripts]]
filter = 'all()'
run-wrapper = "copies"
