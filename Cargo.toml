[package]
name = "lpg"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
exclude = ["docs/evidence/"]

[dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
crc32c = "0.6.8"
rand = "0.10.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.lab]
inherits = "release"
debug = true

# Tests run at opt-level 1: the suite takes 14-20 s instead of 25-28 s
# (measured 2026-10-03), and debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
