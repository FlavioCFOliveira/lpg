[package]
name = "lpg"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
exclude = ["docs/evidence/"]

[dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
crc32c = "0.6.8"
rand = "0.10.3"
# Temporal values (TS-21): IANA zones read from the operating system
# (`tzdb-zoneinfo`, /usr/share/zoneinfo or TZDIR); jiff bundles no zone
# rules. Zone links are fixed in `src/types/zone_links.rs`.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-zoneinfo"] }
# The public API is async on the application's tokio runtime (TS-02):
# `spawn_blocking` per result batch (`rt`) and the time limit's timer
# (`time`). No other feature is used.
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time"] }
# Events per request and transaction (TS-24). No default features: the
# `attributes` proc-macro crate is not used.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Bulk import and export (TS-26, TS-31): CSV files, JSON Lines with a
# correctly rounded float parser (`float_roundtrip`, FR-IMP-006), GraphML.
csv = "1.4.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
quick-xml = "0.42.0"

[dev-dependencies]
tempfile = "3.27.0"
# Replaces the global allocator of the test binary with one that counts
# the current thread's heap use (peak bytes of a closure). The crate
# forbids `unsafe`, so it cannot define its own `GlobalAlloc`.
allocation-counter = "0.8.1"
# The API tests run on both runtime flavours (rmp #47 acceptance): the
# `multi_thread` runtime needs `rt-multi-thread`, a test-only feature.
tokio = { version = "1.53.2", default-features = false, features = ["rt", "rt-multi-thread", "time"] }

# Concurrency model checkers (TS-30 Concurrency, R11), compiled only under
# their `cfg`: `RUSTFLAGS="--cfg loom"` or `RUSTFLAGS="--cfg shuttle"`.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"
# tokio 1.53.2 does not compile under `--cfg loom` without its `sync`
# feature (`src/runtime/time/entry.rs:62` imports `sync::AtomicWaker`, which
# `src/sync/mod.rs:489` gates on `sync`). The feature joins the `loom`
# test builds only; normal builds keep `rt` and `time`.
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time", "sync"] }

[target.'cfg(shuttle)'.dev-dependencies]
shuttle = "0.9.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(shuttle)', 'cfg(fuzzing)'] }

[profile.lab]
inherits = "release"
debug = true

# Tests run at opt-level 1: the suite takes 14-20 s instead of 25-28 s
# (measured 2026-10-03), and debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
