[package]
name = "lpg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# libfuzzer-sys is `(MIT OR Apache-2.0) AND NCSA` (crates.io); NCSA is not
# on the NFR-DEP-002 list, so this crate is never part of lpg's dependency
# tree.
[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.lpg]
path = ".."

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "binder"
path = "fuzz_targets/binder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexical_parse"
path = "fuzz_targets/lexical_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dump_read"
path = "fuzz_targets/dump_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_read"
path = "fuzz_targets/csv_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonl_read"
path = "fuzz_targets/jsonl_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graphml_read"
path = "fuzz_targets/graphml_read.rs"
test = false
doc = false
bench = false

# Standalone: never a member of the lpg workspace.
[workspace]
